# omnictl cluster template sync -v -f cluster-template.yaml
---
kind: Cluster
name: labber
labels:
  cluster-id: "1"
kubernetes:
  version: v1.35.0
talos:
  version: v1.14.4
patches:
  - name: disable-default-cni
    inline:
      cluster:
        network:
          cni:
            name: none
        proxy:
          disabled: true
---
kind: ControlPlane
machineClass:
  name: proxmox-control-plane
  size: 3
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfsd
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
patches:
  - file: ./patches/control-plane.yaml
---
kind: Workers
name: workers
machineClass:
  name: proxmox-worker
  size: 2
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfsd
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
patches:
  - file: ./patches/worker.yaml
  - name: longhorn-storage
    inline:
      machine:
        kubelet:
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/local/longhorn
              options:
                - bind
                - rshared
                - rw
---
kind: Workers
name: gpu-workers-pxmx-3
machineClass:
  name: proxmox-intel-gpu-worker-pxmx-3
  size: 1
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfsd
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/xe
patches:
  - name: gpu-worker-labels
    inline:
      machine:
        nodeLabels:
          gpu-worker: "true"
          intel.com/gpu: "true"
  - file: ./patches/intel-gpu-worker.yaml
  - name: longhorn-storage
    inline:
      machine:
        kubelet:
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/local/longhorn
              options:
                - bind
                - rshared
                - rw
