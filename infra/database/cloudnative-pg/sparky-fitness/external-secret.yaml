apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-owner-secret
  namespace: sparky-fitness
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: sparkyfitness-owner-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: sparkyfitness-owner-secret
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    - secretKey: password
      remoteRef:
        key: sparkyfitness-owner-secret
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
