# Owner credentials (sparkyfitness-owner-secret) are managed by infra/database/cloudnative-pg/sparky-fitness
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparky-app-secret
  namespace: sparky-fitness
  labels:
    app.kubernetes.io/name: sparky-fitness-secrets
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: sparky-app-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: sparkyfitness-postgres-secrets
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    - secretKey: password
      remoteRef:
        key: sparkyfitness-postgres-secrets
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-secrets
  namespace: sparky-fitness
  labels:
    app.kubernetes.io/name: sparky-fitness-secrets
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: sparkyfitness-secrets
    creationPolicy: Owner
  data:
    - secretKey: api_encryption_key
      remoteRef:
        key: sparkyfitness-secrets
        property: api-encryption-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    - secretKey: better_auth_secret
      remoteRef:
        key: sparkyfitness-secrets
        property: better-auth-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
