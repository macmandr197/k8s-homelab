apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-server
  namespace: sparky-fitness
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3010
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-frontend
  namespace: sparky-fitness
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
