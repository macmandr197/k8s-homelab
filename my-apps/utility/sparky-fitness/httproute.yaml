apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sparky-fitness
  namespace: sparky-fitness
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "sparky.mcmn.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sparkyfitness-frontend
          port: 80
          weight: 1
--- #External DNS specific for exposing to CF tunnel. external-dns does not support annotating gateway API + HTTP Route
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: sparky-fitness-tunnel
  namespace: sparky-fitness
  labels:
    external-dns: "true"
spec:
  endpoints:
    - dnsName: sparky.mcmn.me
      recordType: CNAME
      targets:
        - 37ab5ca6-9491-4bc3-9505-75be85d6e554.cfargotunnel.com
