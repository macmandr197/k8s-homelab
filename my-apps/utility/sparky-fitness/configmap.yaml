apiVersion: v1
kind: ConfigMap
metadata:
  name: sparkyfitness-server-config
  namespace: sparky-fitness
data:
  NODE_ENV: "production"
  TZ: "America/Toronto"
  SPARKY_FITNESS_LOG_LEVEL: "info"
  SPARKY_FITNESS_DB_HOST: "sparkyfitness-db-rw.sparky-fitness.svc.cluster.local"
  SPARKY_FITNESS_DB_PORT: "5432"
  SPARKY_FITNESS_DB_NAME: "sparkyfitness_db"
  SPARKY_FITNESS_FRONTEND_URL: "https://sparky.mcmn.me"
  # Signup is open for first account creation. Set to "true" afterwards, then restart the server (ConfigMap changes do not roll pods).
  SPARKY_FITNESS_DISABLE_SIGNUP: "false"
  ALLOW_PRIVATE_NETWORK_CORS: "false"
  SPARKY_FITNESS_FORCE_EMAIL_LOGIN: "true"
  SPARKY_FITNESS_DISABLE_EMAIL_LOGIN: "false"
  SPARKY_FITNESS_DISABLE_PASSKEY_LOGIN: "false"
  SPARKY_FITNESS_FORCE_PASSKEY_LOGIN: "false"
